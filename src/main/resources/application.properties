spring.application.name=persistence-demo

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/persistence_demo}
spring.datasource.username=${DB_USERNAME:demo}
spring.datasource.password=${DB_PASSWORD:demo}

# Runs schema.sql on startup (it uses CREATE TABLE IF NOT EXISTS)
spring.sql.init.mode=always

mybatis.mapper-locations=classpath:mapper/*.xml
mybatis.type-aliases-package=com.example.persistencedemo.model
mybatis.configuration.map-underscore-to-camel-case=true

# Logs the SQL MyBatis executes
logging.level.com.example.persistencedemo.mapper=debug
